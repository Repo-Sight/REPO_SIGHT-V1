name: CI

on:
  push:
    branches: [main, Version2]
  pull_request:
    branches: [main, Version2]

jobs:
  analyser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S analyser -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vercel cannot compile C++, so production runs the PREBUILT binary in
      # backend/bin -- it does not rebuild itself when analyser sources change.
      # Fail if it disagrees with a binary built from these sources.
      - name: Committed binary matches a fresh build
        run: |
          chmod +x backend/bin/linux-x64-cma
          node scripts/check-binary-drift.mjs build/cma backend/bin/linux-x64-cma

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API layer tests (rule catalog, enrichment, /api/rules)
        run: npm run test:api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build (prerender every route)
        run: npm run build
      - name: SEO gate (h1, canonical, duplicates, sitemap)
        run: npm run check
      - name: Demo report gate (bundled sample report is valid)
        run: npm run check:demo
