name: CI

on:
  push:
    branches: [Version2]
  pull_request:
    branches: [Version2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S analyser -B build
      - name: Build
        run: cmake --build build --config Release
